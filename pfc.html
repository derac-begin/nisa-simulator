<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <!-- Fallback redirect via meta tag -->
    <meta http-equiv="refresh" content="0; url=./pfc_calc_v0.19.0.html">
    <!-- Primary redirect via JavaScript -->
    <script>
        window.location.replace('./pfc_calc_v0.19.0.html');
    </script>
    <style>
        :root {
            /* Light Theme Variables */
            --bg-color: #f4f7f6;
            --text-color: #2c3e50;
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                /* Dark Theme Variables */
                --bg-color: #0d1117;
                --text-color: #c9d1d9;
                --primary-color: #58a6ff;
                --secondary-color: #1f6feb;
            }
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            padding: 2rem;
            max-width: 500px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @media (prefers-color-scheme: dark) {
            .spinner {
                border: 4px solid rgba(255, 255, 255, 0.1);
                border-left-color: var(--primary-color);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }

        p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecting to PFC Calculator...</h1>
        <p>自動的に転送されない場合は、以下のリンクをクリックしてください。</p>
        <p><a href="./pfc_calc_v0.19.0.html">PFC Calculator へ進む</a></p>
    </div>
</body>
</html>
